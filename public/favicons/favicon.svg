<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E62429" />
      <stop offset="60%" stop-color="#FF3336" />
      <stop offset="100%" stop-color="#00569C" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F87171" />
      <stop offset="100%" stop-color="#E62429" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="18" />

  <!-- Inner Glass Panel Accent -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="#1E293B" fill-opacity="0.3" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2" />

  <!-- PB Initials Monogram -->
  <g filter="url(#glow)">
    <text x="50%" y="54%" font-family="Inter, system-ui, -apple-system, sans-serif" font-weight="900" font-size="235" fill="url(#textGrad)" text-anchor="middle" dominant-baseline="middle" letter-spacing="-10">
      PB
    </text>
  </g>

  <!-- Active Tech Accent Pulse Dot -->
  <circle cx="400" cy="112" r="20" fill="#E62429" />
  <circle cx="400" cy="112" r="10" fill="#FFFFFF" opacity="0.8" />
</svg>
